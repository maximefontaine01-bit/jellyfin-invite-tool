services:
  jellyfin-invite:
    build: .
    container_name: jellyfin-invite
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - JELLYFIN_URL=${JELLYFIN_URL}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
    networks:
      - proxy_network

networks:
  proxy_network:
    external: true
