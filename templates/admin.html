<!DOCTYPE html>
<html>
<head><title>Admin - Invitations Jellyfin</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
<div class="card">
<h2>🎬 Gestion des invitations</h2>

<form method="POST" action="/admin/create">
<label>Durée de validité du lien (heures)</label>
<input type="number" name="duration_hours" value="24">
<label>Nombre d'utilisations max</label>
<input type="number" name="max_uses" value="1">
<label>Expiration du compte (jours, optionnel)</label>
<input type="number" name="expire_days" placeholder="Illimité si vide">
<button type="submit">+ Générer une invitation</button>
</form>

{% if new_link %}
<div id="new-link-box" style="margin-top:1rem; padding:0.7rem; background:rgba(15,157,88,0.15); border-radius:8px; font-size:0.85rem;">
  ✅ Lien copié dans le presse-papier !
</div>
<script>
  navigator.clipboard.writeText("{{ new_link }}").catch(() => {
    document.getElementById('new-link-box').innerText = "Lien généré : {{ new_link }}";
  });
</script>
{% endif %}

<ul>
{% for token, data in invites.items() %}
<li>
<code id="code-{{ token }}">/invite/{{ token }}</code>
<button onclick="copyLink('{{ request.host_url }}invite/{{ token }}')" style="width:auto; padding:0.3rem 0.6rem; margin:0; font-size:0.75rem;">📋</button>
{% if data.used_count >= data.max_uses %}<span class="badge used">Épuisé</span>{% else %}<span class="badge">Actif</span>{% endif %}
</li>
{% endfor %}
</ul>

<div style="margin-top:1.5rem; display:flex; flex-direction:column; gap:0.5rem;">
  <a href="/admin/stats" style="color:#8ab4f8; font-size:0.9rem; text-decoration:none;">📊 Voir les statistiques</a>
  <a href="/admin/logout" style="color:rgba(255,255,255,0.5); font-size:0.8rem; text-decoration:none;">Se déconnecter</a>
</div>

</div>

<script>
function copyLink(fullUrl) {
  navigator.clipboard.writeText(fullUrl).then(() => {
    alert("Lien copié : " + fullUrl);
  });
}
</script>
</body>
</html>
